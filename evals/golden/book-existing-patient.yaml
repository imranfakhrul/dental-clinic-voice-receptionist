# Golden conversation (P0-04). Synthetic data only. Asserts states, slots and tool calls, never wording.
flow: book-existing-patient
version: '0.1'
synthetic: true
notes: Everything in one message, then verify, choose, consent, confirm (spec §8 first edge case).
start_state: GREETING
turns:
- user: Hi, I'm Jane Test, born March 14 1985, I need a cleaning next Tuesday morning
  expect_state: VERIFY
  expect_slots:
    intent: book
    first_name: Jane
    last_name: Test
    dob: '1985-03-14'
    reason_code: recall_cleaning
    preferred_time: next Tuesday morning
  expect_tools:
  - search_patient
- user: My ZIP is 97201
  expect_state: AVAILABILITY
  expect_slots:
    zip: '97201'
  expect_tools:
  - verify_patient
  - get_appointment_availability
- user: The 9 o'clock one please
  expect_state: CONSENT
  expect_slots:
    chosen_slot: opt:1
- user: Yes, send on WhatsApp. The number ending in 0100 is right
  expect_state: CONFIRM
  expect_slots:
    consent_whatsapp: true
  expect_tools:
  - record_consent
- user: Yes, that's all correct
  expect_state: WRAP_UP
  expect_tools:
  - book_appointment
- user: No, that's everything, thanks
  expect_state: END
end_state: END
