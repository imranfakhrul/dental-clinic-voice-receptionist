# Golden conversation (P0-04). Synthetic data only. Asserts states, slots and tool calls, never wording.
flow: emergency
version: '0.1'
synthetic: true
notes: 'Tier 2 for an unverified patient: urgent slot chosen first, then identify and verify, keeping the slot (P2-20). Consent already on record.'
start_state: GREETING
turns:
- user: Hi, my cheek is swollen on the right side
  expect_state: EMERGENCY
  expect_slots:
    urgent: true
    reason_code: emergency_exam
  expect_tools:
  - get_appointment_availability
- user: The 10:30 tomorrow please
  expect_state: IDENTIFY
  expect_slots:
    chosen_slot: opt:1
- user: Jane Test, March 14 1985
  expect_state: VERIFY
  expect_tools:
  - search_patient
- user: '97201'
  expect_state: CONFIRM
  expect_tools:
  - verify_patient
- user: 'Yes'
  expect_state: WRAP_UP
  expect_tools:
  - book_appointment
- user: No, thank you
  expect_state: END
end_state: END
