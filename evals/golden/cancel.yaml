# Golden conversation (P0-04). Synthetic data only. Asserts states, slots and tool calls, never wording.
flow: cancel
version: '0.1'
synthetic: true
notes: Unverified cancel outside the 24-hour window; no consent step.
start_state: GREETING
turns:
- user: I want to cancel my appointment
  expect_state: IDENTIFY
  expect_slots:
    intent: cancel
- user: Jane Test, March 14 1985
  expect_state: VERIFY
  expect_tools:
  - search_patient
- user: '97201'
  expect_state: CANCEL
  expect_tools:
  - verify_patient
  - get_patient_appointments
- user: The one on Friday the 12th
  expect_state: CONFIRM
  expect_slots:
    operation: cancel
    apt_num: handle:A1
- user: Yes, cancel it
  expect_state: WRAP_UP
  expect_tools:
  - cancel_appointment
- user: No, that's all
  expect_state: END
end_state: END
