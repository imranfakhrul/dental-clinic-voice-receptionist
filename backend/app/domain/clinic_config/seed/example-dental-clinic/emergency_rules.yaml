# Emergency rules: Example Dental Clinic (P0-03). Reviewed by the dentist for development and testing.
# Readable version: docs/discovery/emergency-protocol.md. Production needs status approved (P5-07 via P4-12).
# Sample values: replace them with the clinic's reviewed rules. No PHI.
schema_version: 1
clinic_slug: example-dental-clinic
rules_version: '0.2'
status: clinic_reviewed
reviewed_by: ['Dr. Casey Example, dentist (protocol owner)']
reviewed_on: '2026-11-26'
matching:
  negation_words: ['no', not, without, never, none]
  negation_window_words: 3
urgent_slot_max_hours: 24
categories:
- id: t1_airway
  tier: 1
  label: Difficulty breathing or swallowing
  phrases: [cannot breathe, cannot really breathe, hard to breathe, trouble breathing, difficulty breathing, short of breath, struggling to breathe, cannot swallow, hard to swallow, trouble swallowing,
    throat is closing, choking]
  all_of_groups:
  - [throat]
  - [closing, tight, swelling, swollen, swelled]
- id: t1_spreading_swelling
  tier: 1
  label: Swelling spreading to the eye or neck
  phrases: []
  all_of_groups:
  - [swelling, swollen, puffy, swelled, swell]
  - [eye, eyes, neck, throat, under my jaw]
- id: t1_bleeding
  tier: 1
  label: Bleeding that won't stop
  phrases: [bleeding will not stop, will not stop bleeding, cannot stop the bleeding, bleeding does not stop, a lot of blood, lots of blood, blood everywhere, soaking through]
  all_of_groups:
  - [blood, bleeding]
  - [will not stop, keeps coming, soaking, gushing, pouring]
- id: t1_trauma
  tier: 1
  label: Major trauma to the face or head
  phrases: [broken jaw, jaw is broken, car accident, passed out, knocked out cold, hit my head, head injury, hit in the head, jaw is locked, jaw locked, cannot open my mouth]
  all_of_groups: []
- id: t1_medical
  tier: 1
  label: Non-dental medical emergency
  phrases: [chest pain, face is drooping, face drooping, slurred, allergic reaction, fainted, will not wake up, unconscious, seizure, stroke, heart attack]
  all_of_groups:
  - [face]
  - [numb, drooping, droops]
- id: crisis
  tier: crisis
  label: Suicide or self-harm statements
  phrases: [want to die, kill myself, killing myself, end my life, hurting myself, hurt myself, suicide, suicidal, do not want to be alive, better off dead, self harm]
  all_of_groups: []
- id: t2_severe_pain
  tier: 2
  label: Severe pain (8-10 out of 10)
  phrases: [worst pain, unbearable, excruciating, couldn't sleep, could not sleep, cannot sleep, killing me, 8 out of 10, 9 out of 10, 10 out of 10, painkillers aren't working, painkillers are not working,
    painkillers do not help, severe pain, screaming in pain]
  all_of_groups: []
- id: t2_facial_swelling
  tier: 2
  label: Facial swelling (not spreading to eye or neck)
  phrases: [face is swollen, face is swelling, facial swelling, cheek is swollen, swollen cheek, swollen jaw, jaw is swollen]
  all_of_groups:
  - [swollen, swelling, puffy]
  - [face, cheek, jaw]
- id: t2_knocked_out
  tier: 2
  label: Knocked-out or dislodged permanent tooth
  phrases: [knocked out, knocked loose, tooth came out, tooth got knocked, lost a tooth]
  all_of_groups: []
- id: t2_infection
  tier: 2
  label: Signs of infection
  phrases: [abscess, pus, infected tooth, tooth infection, infected gum]
  all_of_groups:
  - [fever, temperature]
  - [tooth, teeth, gum, jaw]
- id: t2_post_extraction
  tier: 2
  label: Bleeding or severe pain after a tooth removal
  phrases: [dry socket]
  all_of_groups:
  - [pulled, extraction, extracted, removed, taken out]
  - [worse, bleeding, throbbing, unbearable, swelling, swollen]
- id: t3_mild_pain
  tier: 3
  label: Mild or occasional tooth pain
  reason_code: toothache
  phrases: [mild toothache, toothache, hurts a little, slight ache, a bit sore, aches sometimes, on and off]
  all_of_groups: []
- id: t3_sensitivity
  tier: 3
  label: Sensitivity to hot, cold or sweet
  reason_code: sensitivity
  phrases: [sensitive to cold, sensitive to hot, sensitive teeth, sensitive tooth, hurts with cold, cold drinks, ice cream, sweet things, sweets]
  all_of_groups: []
- id: t3_minor_chip
  tier: 3
  label: Small chip, no pain
  reason_code: broken_tooth
  phrases: [chipped, small chip, tiny chip, chip on my tooth]
  all_of_groups: []
- id: t3_lost_filling
  tier: 3
  label: Lost filling or crown, no severe pain
  reason_code: lost_filling_or_crown
  phrases: [filling fell out, lost a filling, lost my filling, filling came out, crown came off, crown fell off, crown fell out]
  all_of_groups: []
tier_actions:
  tier1:
    script_id: tier1_911
    repeat_script_id: tier1_repeat
    callback_urgency: URGENT
    stop_booking: true
  crisis:
    script_id: crisis_988
    repeat_script_id: crisis_988
    callback_urgency: URGENT
    stop_booking: true
  tier2:
    script_id: tier2_intro
    no_slot_script_id: tier2_no_slot
    reason_code: emergency_exam
    callback_urgency: URGENT
  tier3:
    script_id: tier3_routine
  uncertain:
    script_id: uncertain_urgent
    callback_urgency: URGENT
    stop_booking: false
scripts:
- id: tier1_911
  text: This sounds like it could be a medical emergency. Please call 911 now or go to the nearest emergency room. Don't wait for us to call you back. I'm also letting our team at {clinic_name} know right
    away.
  contains_first_aid: false
- id: tier1_repeat
  text: Please call 911 or go to the nearest emergency room now. Our team has been told and will follow up with you.
  contains_first_aid: false
- id: crisis_988
  text: I'm really sorry you're going through this. You can call or text 988 right now to talk to someone at the Suicide & Crisis Lifeline. If you are in immediate danger, call 911.
  contains_first_aid: false
- id: uncertain_urgent
  text: I want to make sure you get the right help. If you have trouble breathing or swallowing, swelling spreading to your eye or neck, or bleeding that won't stop, please call 911 now. I'm marking your
    request as urgent so our team can contact you as soon as possible.
  contains_first_aid: false
- id: tier2_intro
  text: I'm sorry you're dealing with this. Let me find the earliest urgent appointment for you with our dentist.
  contains_first_aid: false
- id: tier2_no_slot
  text: I'm sorry, we don't have an urgent opening right now. I've marked your request as urgent, and our team will contact you as soon as possible at {callback_phone}. If it gets worse, for example swelling
    spreading to your eye or neck, trouble breathing or swallowing, or bleeding that won't stop, call 911 or go to the nearest emergency room.
  contains_first_aid: false
- id: tier3_routine
  text: I'm not able to give medical advice, but I can book a visit so the dentist can take a look.
  contains_first_aid: false
